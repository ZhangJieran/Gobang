schema: spec-driven

# Project context
# Constraints that should guide OpenSpec artifacts and workflows.
context: |
  项目：五子棋（Gomoku）游戏
  技术栈：
    - 前端：React + TypeScript
    - 后端：Python
  不使用数据库

# Per-artifact rules
rules:
  proposal:
    - 所有功能开发必须严格按 OpenSpec 四步顺序执行：探索阶段 → 提案阶段 → 执行阶段 → 归档阶段，缺一不可
    - 无用户确认绝不主动推进到下一步
  design:
    - 无用户确认绝不主动推进到下一步
  tasks:
    - 无用户确认绝不主动推进到下一步
    - 不超前写代码，不跳过任何步骤，仅完成当前步骤
  specs:
    - 无用户确认绝不主动推进到下一步

# Per-operation guidance
operations:
  apply:
    guidance:
      - 仅完成当前步骤的任务，待用户确认后再进入下一环
      - 不超前写代码
  archive:
    guidance:
      - 归档前确认变更已完整实现并通过验证
